name: CI/CD_PUSH

on:
  push:
    branches:
      - 'develop'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Go Environment
        uses: actions/setup-go@v4
        with:
          go-version: ^1.20
        id: go

      - name: Checkout
        uses: actions/checkout@v3
